volumes:
  db:
services:
  api:
    image: time-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: 8000
      DB_HOST: db # Will resolve to local docker ip
      DB_PORT: 3306 # Use internal network port
      DB_NAME: time
      DB_USER: timeuser
      DB_PASS: timepass
    ports:
      - 8001:8000
    post_start:
      - command: "npm --prefix node_modules/time-core run db-up"
  db:
    image: bitnami/mysql:5.7.43
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootPass
      MYSQL_DATABASE: time
      MYSQL_USER: timeuser
      MYSQL_PASSWORD: timepass
    ports:
      - 3307:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "--user=root", "--password=rootPass","ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - db:/bitnami/mysql/data